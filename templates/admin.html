<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ダッシュボード - ポケモンシミュレーター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'M PLUS 2', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #f1f5f9;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-refresh {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .btn-refresh:hover {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        .instruction-box {
            background-color: #1e293b;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            color: var(--text-muted);
            font-weight: 700;
        }

        .wish-list {
            margin: 0;
            padding-left: 15px;
            font-size: 0.9rem;
        }

        .allocation-selects {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            width: 75px;
        }

        select {
            padding: 6px 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            width: 180px;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
        }

        /* Modal/Notification styles */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }
        .toast.success { background-color: var(--success); display: block; }
        .toast.error { background-color: var(--error); display: block; }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ポケモンシミュレーター 管理者画面</h1>
            <button id="refresh-btn" class="btn btn-refresh">🔄 リストを更新</button>
        </header>

        <div class="instruction-box">
            <strong>📋 割り当てと承認手順:</strong>
            <br>
            新規登録ユーザーの希望ポケモンを参考に、割り当てるポケモンを決定して「OK (承認)」ボタンを押してください。
            裏でExcelファイルが自動的に更新され、ユーザーの待機状態が解除されます（Excelを直接編集して閉じる必要はありません）。
        </div>

        <div class="card">
            <h2>待機中のユーザー一覧</h2>
            <div id="users-table-container">
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>ユーザーID</th>
                            <th>名前</th>
                            <th>希望ポケモン (1〜5)</th>
                            <th>割り当て決定 (ポケモン1 &amp; ポケモン2)</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="users-list">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
                <div id="empty-msg" class="empty-state hidden">
                    待機中のユーザーはいません。
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const toast = document.getElementById('toast');
        const usersList = document.getElementById('users-list');
        const emptyMsg = document.getElementById('empty-msg');
        const usersTable = document.getElementById('users-table');
        
        let allPokemons = []; // Cached pokemon name list

        function showToast(message, isSuccess = true) {
            toast.textContent = message;
            toast.className = 'toast ' + (isSuccess ? 'success' : 'error');
            setTimeout(() => {
                toast.className = 'toast';
            }, 4000);
        }

        async function fetchPendingUsers() {
            try {
                const response = await fetch('/api/admin/pending');
                const data = await response.json();
                if (data.success) {
                    allPokemons = data.all_pokemons || [];
                    renderUsers(data.pending);
                } else {
                    showToast(data.message || 'データの取得に失敗しました。', false);
                }
            } catch (err) {
                console.error(err);
                showToast('サーバーとの通信に失敗しました。', false);
            }
        }

        function renderUsers(users) {
            usersList.innerHTML = '';
            if (users.length === 0) {
                usersTable.classList.add('hidden');
                emptyMsg.classList.remove('hidden');
                return;
            }

            usersTable.classList.remove('hidden');
            emptyMsg.classList.add('hidden');

            users.forEach(user => {
                const tr = document.createElement('tr');
                
                // Build wish list HTML
                const wishListHTML = user.wishes.map((w, idx) => `<li>第${idx+1}: ${w || '未選択'}</li>`).join('');
                
                // Default setup: Prefill select boxes with 1st and 2nd choices if available
                const defaultP1 = user.wishes[0] || '';
                const defaultP2 = user.wishes[1] || '';

                // Build options HTML for select boxes
                let optionsHTML = '<option value="">選択してください</option>';
                allPokemons.forEach(pokeName => {
                    optionsHTML += `<option value="${pokeName}">${pokeName}</option>`;
                });
                tr.innerHTML = `
                    <td><strong>${user.user_id}</strong></td>
                    <td><strong>${user.name || '-'}</strong></td>
                    <td>
                        <ol class="wish-list">
                            ${wishListHTML}
                        </ol>
                    </td>
                    <td>
                        <div class="allocation-selects">
                            <div class="select-group">
                                <label>ポケモン 1</label>
                                <select class="poke1-select" id="poke1-${user.user_id}">
                                    ${optionsHTML}
                                </select>
                            </div>
                            <div class="select-group">
                                <label>ポケモン 2</label>
                                <select class="poke2-select" id="poke2-${user.user_id}">
                                    ${optionsHTML}
                                </select>
                            </div>
                        </div>
                    </td>
                    <td>
                        <button class="btn approve-btn" data-id="${user.user_id}">OK (承認)</button>
                    </td>
                `;

                // Set default selections
                const select1 = tr.querySelector(`.poke1-select`);
                const select2 = tr.querySelector(`.poke2-select`);
                if (allPokemons.includes(defaultP1)) select1.value = defaultP1;
                if (allPokemons.includes(defaultP2)) select2.value = defaultP2;

                // Bind click event to OK button
                tr.querySelector('.approve-btn').addEventListener('click', () => {
                    const poke1 = select1.value;
                    const poke2 = select2.value;
                    
                    if (!poke1 || !poke2) {
                        showToast('ポケモン1とポケモン2を両方選択してください。', false);
                        return;
                    }
                    if (poke1 === poke2) {
                        showToast('同じポケモンを2つ割り当てることはできません。', false);
                        return;
                    }
                    
                    approveUser(user.user_id, poke1, poke2);
                });
                
                usersList.appendChild(tr);
            });
        }

        async function approveUser(userId, poke1, poke2) {
            try {
                const response = await fetch('/api/admin/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userId,
                        pokemon1: poke1,
                        pokemon2: poke2
                    })
                });
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showToast(data.message);
                    fetchPendingUsers(); // Reload list
                } else {
                    showToast(data.message || '承認エラーが発生しました。', false);
                }
            } catch (err) {
                console.error(err);
                showToast('サーバーとの通信に失敗しました。', false);
            }
        }

        document.getElementById('refresh-btn').addEventListener('click', fetchPendingUsers);

        // --- Battle Administration Logic ---
        // Create new container for Battle administration
        const battleAdminHTML = `
        <div class="card" style="margin-top: 30px;">
            <h2>対戦管理（ポケモンバトル）</h2>
            <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <div style="flex: 1; background: #0f172a; padding: 15px; border-radius: 8px;">
                    <h3>⚔️ バトル待機中の参加者</h3>
                    <ul id="battle-waiting-list" style="padding-left: 20px; line-height: 1.8;">
                        <li>待機中のプレイヤーはいません。</li>
                    </ul>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <select id="select-player-a" style="width: 100%; max-width: 200px;"><option value="">プレイヤーAを選択</option></select>
                        <select id="select-player-b" style="width: 100%; max-width: 200px;"><option value="">プレイヤーBを選択</option></select>
                        <button id="start-battle-btn" class="btn" style="background-color: var(--success);">対戦開始</button>
                    </div>
                </div>

                <div style="flex: 1; background: #0f172a; padding: 15px; border-radius: 8px;">
                    <h3>👥 採点画面を見ているユーザー</h3>
                    <ul id="grading-viewers-list" style="padding-left: 20px; line-height: 1.8;">
                        <li>誰も見ていません。</li>
                    </ul>
                </div>
            </div>

            <div id="active-battle-panel" style="background: #1e293b; border: 2px solid var(--primary); border-radius: 8px; padding: 15px; margin-top: 15px; display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0; margin-bottom: 15px;">
                    <h3 style="margin: 0; color: #60a5fa;">⚡ 進行中のバトル</h3>
                    <button id="force-end-btn" class="btn" style="background-color: var(--error);">バトルを強制終了</button>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <div id="p-a-panel" style="flex: 1; padding: 10px; border-right: 1px solid var(--border);">
                        <strong>プレイヤーA: <span id="label-player-a">-</span></strong>
                        <div id="p-a-poke-details" style="font-size: 0.9rem; margin-top: 5px; color: var(--text-muted);"></div>
                        <div style="margin-top: 10px;">
                            選択した技: <span id="a-selected-move" style="font-weight: bold; color: #fbbf24;">未選択</span>
                        </div>
                    </div>
                    <div id="p-b-panel" style="flex: 1; padding: 10px;">
                        <strong>プレイヤーB: <span id="label-player-b">-</span></strong>
                        <div id="p-b-poke-details" style="font-size: 0.9rem; margin-top: 5px; color: var(--text-muted);"></div>
                        <div style="margin-top: 10px;">
                            選択した技: <span id="b-selected-move" style="font-weight: bold; color: #fbbf24;">未選択</span>
                        </div>
                    </div>
                </div>

                <!-- Swap Request Approve -->
                <div id="swap-request-area" style="background: #ef444422; border: 1px solid var(--error); border-radius: 6px; padding: 10px; margin-bottom: 15px; display: none; display: flex; justify-content: space-between; align-items: center;">
                    <span id="swap-request-message" style="font-weight: bold;">交代要請が届いています。</span>
                    <button id="approve-swap-btn" class="btn" style="background-color: var(--success);">交代を許可する</button>
                </div>

                <!-- Target Grader Selection -->
                <div style="margin-bottom: 15px; background: #0f172a; padding: 12px; border-radius: 6px;">
                    <strong>🎯 現在の審査対象選択:</strong>
                    <div style="margin-top: 8px; display: flex; gap: 15px;">
                        <label><input type="radio" name="grading-target" value="A"> プレイヤーAの審査</label>
                        <label><input type="radio" name="grading-target" value="B"> プレイヤーBの審査</label>
                        <label><input type="radio" name="grading-target" value="None" checked> プレイヤーを選択しない（観戦者に点数のみ表示）</label>
                    </div>
                </div>

                <!-- Scoring status -->
                <div style="display: flex; align-items: center; justify-content: space-between; background: #111827; padding: 15px; border-radius: 6px;">
                    <div>
                        <strong>採点結果 (6人の得点):</strong>
                        <span id="grading-scores-history" style="color: #fbbf24; margin-left: 10px; font-weight: bold;">-</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="reset-scores-btn" class="btn" style="background-color: var(--error); font-size: 0.9rem; padding: 6px 12px;">採点をリセット</button>
                        <div style="text-align: right;">
                            <span style="font-size: 0.9rem; color: var(--text-muted);">計算結果: </span>
                            <strong style="font-size: 1.5rem; color: var(--success);"><span id="calculated-score-val">0</span> 点</strong>
                        </div>
                    </div>
                </div>

                <!-- Force/Override Score for Debugging -->
                <div style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 10px; border-radius: 6px; border: 1px dashed var(--primary);">
                    <span style="font-size: 0.9rem; font-weight: bold;">🛠️ デバッグ用得点強制入力:</span>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="number" id="debug-score-input" placeholder="点数" style="width: 80px; padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: #0f172a; color: white;" min="0">
                        <button id="force-score-btn" class="btn" style="background-color: var(--primary); font-size: 0.9rem; padding: 6px 12px; margin: 0;">点数を強制確定</button>
                    </div>
                </div>

                <div style="margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button id="undo-confirm-btn" class="btn" style="background-color: #f59e0b;">↩️ 直前の審査を取り消す</button>
                </div>
            </div>
        </div>
        `;
        document.querySelector('.container').insertAdjacentHTML('beforeend', battleAdminHTML);

        // Fetch and Update Battle Status periodically
        async function fetchBattleStatus() {
            try {
                const response = await fetch('/api/admin/battle/status');
                const data = await response.json();
                if (data.success) {
                    // Update waiting list
                    const waitingList = document.getElementById('battle-waiting-list');
                    const selectA = document.getElementById('select-player-a');
                    const selectB = document.getElementById('select-player-b');
                    
                    const currentWaitingIds = Array.from(selectA.options)
                        .map(opt => opt.value)
                        .filter(val => val !== "");
                    const newWaitingIds = data.waiting.map(p => String(p.user_id));
                    const waitingSame = currentWaitingIds.length === newWaitingIds.length &&
                        currentWaitingIds.every((val, index) => val === newWaitingIds[index]);

                    if (!waitingSame) {
                        const prevValA = selectA.value;
                        const prevValB = selectB.value;

                        selectA.innerHTML = '<option value="">プレイヤーAを選択</option>';
                        selectB.innerHTML = '<option value="">プレイヤーBを選択</option>';

                        if (data.waiting.length === 0) {
                            waitingList.innerHTML = '<li>待機中のプレイヤーはいません。</li>';
                        } else {
                            waitingList.innerHTML = '';
                            data.waiting.forEach(p => {
                                const li = document.createElement('li');
                                li.textContent = `${p.name} (${p.user_id})`;
                                waitingList.appendChild(li);

                                const optA = document.createElement('option');
                                optA.value = p.user_id;
                                optA.textContent = p.name;
                                selectA.appendChild(optA);

                                const optB = document.createElement('option');
                                optB.value = p.user_id;
                                optB.textContent = p.name;
                                selectB.appendChild(optB);
                            });

                            selectA.value = prevValA;
                            selectB.value = prevValB;
                        }
                    }

                    // Update graders view
                    const gradersList = document.getElementById('grading-viewers-list');
                    const currentGraderNames = Array.from(gradersList.children)
                        .map(li => li.textContent)
                        .filter(txt => txt !== "誰も見ていません。");
                    const newGraderNames = data.graders;
                    const gradersSame = currentGraderNames.length === newGraderNames.length &&
                        currentGraderNames.every((val, index) => val === newGraderNames[index]);

                    if (!gradersSame) {
                        if (data.graders.length === 0) {
                            gradersList.innerHTML = '<li>誰も見ていません。</li>';
                        } else {
                            gradersList.innerHTML = '';
                            data.graders.forEach(name => {
                                const li = document.createElement('li');
                                li.textContent = name;
                                gradersList.appendChild(li);
                            });
                        }
                    }

                    // Active Battle details
                    const activePanel = document.getElementById('active-battle-panel');
                    const b = data.active_battle;
                    if (b && b.active) {
                        activePanel.style.display = 'block';
                        document.getElementById('label-player-a').textContent = data.players_details.A || b.player_a;
                        document.getElementById('label-player-b').textContent = data.players_details.B || b.player_b;

                        // Poke HP
                        const pA = b.a_pokemon[b.a_active_idx];
                        const pB = b.b_pokemon[b.b_active_idx];
                        document.getElementById('p-a-poke-details').textContent = pA ? `${pA.name} HP: ${pA.hp}/${pA.max_hp}` : '-';
                        document.getElementById('p-b-poke-details').textContent = pB ? `${pB.name} HP: ${pB.hp}/${pB.max_hp}` : '-';

                        // Selected moves
                        document.getElementById('a-selected-move').textContent = b.a_selected_move ? `${b.a_selected_move.name} (威力: ${b.a_selected_move.power})` : '未選択';
                        document.getElementById('b-selected-move').textContent = b.b_selected_move ? `${b.b_selected_move.name} (威力: ${b.b_selected_move.power})` : '未選択';

                        // Swap Request
                        const swapArea = document.getElementById('swap-request-area');
                        if (b.swap_request) {
                            swapArea.style.display = 'flex';
                            const reqName = b.swap_request === 'A' ? (data.players_details.A || b.player_a) : (data.players_details.B || b.player_b);
                            document.getElementById('swap-request-message').textContent = `${reqName} からポケモンの交代要請が届いています。`;
                        } else {
                            swapArea.style.display = 'none';
                        }

                        // Scores
                        document.getElementById('grading-scores-history').textContent = b.scores.length > 0 ? b.scores.join(', ') : 'まだ採点されていません';
                        document.getElementById('calculated-score-val').textContent = data.current_score || 0;

                        // Synchronize and disable/enable target selection radios based on selected moves
                        const currentTarget = b.target_player || 'None';
                        const targetRadio = document.querySelector(`input[name="grading-target"][value="${currentTarget}"]`);
                        if (targetRadio) {
                            targetRadio.checked = true;
                        }

                        const hasMoveA = !!b.a_selected_move;
                        const hasMoveB = !!b.b_selected_move;
                        const radioA = document.querySelector('input[name="grading-target"][value="A"]');
                        const radioB = document.querySelector('input[name="grading-target"][value="B"]');

                        if (radioA) {
                            radioA.disabled = !hasMoveA;
                            radioA.parentElement.style.opacity = hasMoveA ? '1' : '0.5';
                            radioA.parentElement.style.cursor = hasMoveA ? 'pointer' : 'not-allowed';
                        }
                        if (radioB) {
                            radioB.disabled = !hasMoveB;
                            radioB.parentElement.style.opacity = hasMoveB ? '1' : '0.5';
                            radioB.parentElement.style.cursor = hasMoveB ? 'pointer' : 'not-allowed';
                        }
                    } else {
                        activePanel.style.display = 'none';
                    }
                }
            } catch (err) {
                console.error("Error fetching battle admin status:", err);
            }
        }

        // Start battle btn bind
        document.getElementById('start-battle-btn').addEventListener('click', async () => {
            const pA = document.getElementById('select-player-a').value;
            const pB = document.getElementById('select-player-b').value;
            if (!pA || !pB) {
                showToast('2名のプレイヤーを選択してください。', false);
                return;
            }
            try {
                const response = await fetch('/api/admin/battle/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_a: pA, player_b: pB })
                });
                const resData = await response.json();
                if (resData.success) {
                    showToast(resData.message);
                    fetchBattleStatus();
                } else {
                    showToast(resData.message, false);
                }
            } catch (err) {
                showToast('通信エラーが発生しました。', false);
            }
        });

        // Swap Approval
        document.getElementById('approve-swap-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/admin/battle/approve_swap', { method: 'POST' });
                const resData = await response.json();
                if (resData.success) {
                    showToast(resData.message);
                    fetchBattleStatus();
                } else {
                    showToast(resData.message, false);
                }
            } catch (err) {
                showToast('通信エラーが発生しました。', false);
            }
        });

        // Radios target change
        document.querySelectorAll('input[name="grading-target"]').forEach(radio => {
            radio.addEventListener('change', async (e) => {
                const val = e.target.value === 'None' ? null : e.target.value;
                try {
                    const response = await fetch('/api/admin/battle/select_target', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target: val })
                    });
                    const resData = await response.json();
                    if (resData.success) {
                        showToast(resData.message);
                        fetchBattleStatus();
                    } else {
                        showToast(resData.message, false);
                    }
                } catch (err) {
                    showToast('通信エラーが発生しました。', false);
                }
            });
        });

        // Force end battle btn
        document.getElementById('force-end-btn').addEventListener('click', async () => {
            if (!confirm('本当にバトルを強制終了しますか？')) {
                return;
            }
            try {
                const response = await fetch('/api/admin/battle/force_end', { method: 'POST' });
                const resData = await response.json();
                if (resData.success) {
                    showToast(resData.message);
                    fetchBattleStatus();
                } else {
                    showToast(resData.message, false);
                }
            } catch (err) {
                showToast('通信エラーが発生しました。', false);
            }
        });

        // Reset scores btn
        document.getElementById('reset-scores-btn').addEventListener('click', async () => {
            if (!confirm('本当に現在の採点をリセットしますか？')) {
                return;
            }
            try {
                const response = await fetch('/api/admin/battle/reset_scores', { method: 'POST' });
                const resData = await response.json();
                if (resData.success) {
                    showToast(resData.message);
                    fetchBattleStatus();
                } else {
                    showToast(resData.message, false);
                }
            } catch (err) {
                showToast('通信エラーが発生しました。', false);
            }
        });

        // Force score btn
        document.getElementById('force-score-btn').addEventListener('click', async () => {
            const scoreVal = document.getElementById('debug-score-input').value;
            if (scoreVal === "") {
                showToast("点数を入力してください。", false);
                return;
            }
            if (!confirm(`本当に点数を強制的に ${scoreVal} 点で確定しますか？`)) {
                return;
            }
            try {
                const response = await fetch('/api/admin/battle/confirm_score', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ forced_score: parseInt(scoreVal, 10) })
                });
                const resData = await response.json();
                if (resData.success) {
                    showToast(resData.message);
                    document.getElementById('debug-score-input').value = "";
                    fetchBattleStatus();
                } else {
                    showToast(resData.message, false);
                }
            } catch (err) {
                showToast('通信エラーが発生しました。', false);
            }
        });

        // Undo confirm btn
        document.getElementById('undo-confirm-btn').addEventListener('click', async () => {
            if (!confirm('本当に直前の審査（大喜利の採点結果とダメージ）を取り消しますか？')) {
                return;
            }
            try {
                const response = await fetch('/api/admin/battle/undo_confirm', { method: 'POST' });
                const resData = await response.json();
                if (resData.success) {
                    showToast(resData.message);
                    fetchBattleStatus();
                } else {
                    showToast(resData.message, false);
                }
            } catch (err) {
                showToast('通信エラーが発生しました。', false);
            }
        });

        setInterval(fetchBattleStatus, 1500);

        // Initial fetch
        fetchPendingUsers();
    </script>
</body>
</html>
