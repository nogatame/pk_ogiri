<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バトル観戦画面</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: #1f2937;
            --primary: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --text-color: #f9fafb;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'M PLUS 2', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 3-Column Layout */
        .battle-layout {
            display: flex;
            width: 100%;
            gap: 20px;
            flex: 1;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Frameless Side Columns for Pokemons */
        .side-column {
            width: 300px;
            flex-shrink: 0;
            background: transparent;
            border: none;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Center Column: Slide / Standby */
        .center-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 700px; /* Make center slide smaller */
            margin: 0 auto;
        }

        .slide-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 4px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        .slide-container.active-slide {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Info components above image */
        .poke-info-top {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .poke-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }

        .poke-name {
            font-size: 1.8rem;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-a .poke-name {
            color: #60a5fa;
        }

        .player-b .poke-name {
            color: #f87171;
        }

        .poke-level {
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: bold;
        }

        .type-container {
            display: flex;
            gap: 6px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }

        .type-badge {
            font-size: 0.8rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Type Colors */
        .type-normal { background-color: #9ca3af; }
        .type-fire { background-color: #ef4444; }
        .type-water { background-color: #3b82f6; }
        .type-grass { background-color: #10b981; }
        .type-electric { background-color: #f59e0b; color: #000; text-shadow: none; }
        .type-ice { background-color: #22d3ee; color: #000; text-shadow: none; }
        .type-fighting { background-color: #dc2626; }
        .type-poison { background-color: #a855f7; }
        .type-ground { background-color: #ca8a04; }
        .type-flying { background-color: #818cf8; }
        .type-psychic { background-color: #ec4899; }
        .type-bug { background-color: #84cc16; }
        .type-rock { background-color: #a16207; }
        .type-ghost { background-color: #6366f1; }
        .type-dragon { background-color: #4f46e5; }
        .type-steel { background-color: #6b7280; }
        .type-fairy { background-color: #f472b6; }
        .type-dark { background-color: #374151; }

        .hp-bar-bg {
            background: #111827;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #374151;
            position: relative;
            margin-top: 4px;
        }

        .hp-bar-val {
            background: var(--success);
            height: 100%;
            width: 100%;
            transition: width 0.5s ease-out, background-color 0.3s;
        }

        .hp-text {
            text-align: right;
            font-size: 0.95rem;
            font-weight: bold;
            color: #d1d5db;
        }

        /* Pokemon Image display with active target neon highlights */
        .poke-display {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
        }

        .poke-image {
            width: 280px;
            height: 280px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15));
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        #poke-b-img {
            transform: scaleX(-1); /* Face left */
        }

        /* Neon glow on active target image */
        .active-target #poke-a-img {
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.8)) drop-shadow(0 0 35px rgba(245, 158, 11, 0.4));
        }
        .active-target #poke-b-img {
            transform: scaleX(-1);
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.8)) drop-shadow(0 0 35px rgba(245, 158, 11, 0.4));
        }

        /* Log Section */
        .bottom-log-container {
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 15px 25px;
            box-sizing: border-box;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .log-header {
            font-size: 1rem;
            font-weight: 900;
            color: #10b981;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .battle-log {
            font-family: monospace;
            font-size: 1.15rem;
            line-height: 1.6;
            height: 90px;
            overflow-y: auto;
            color: #34d399;
        }

        /* Score Box for grader only target mode */
        .score-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(7, 10, 19, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 3px solid #f59e0b;
            z-index: 10;
        }

        .score-lbl {
            font-size: 1.5rem;
            color: #f59e0b;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-val {
            font-size: 5.5rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.7);
        }

        /* Standby state */
        .standby-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
            aspect-ratio: 16/9;
        }

        .standby-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .standby-desc {
            font-size: 1.25rem;
            color: #9ca3af;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Main Battle/Slide Layout Area -->
    <div class="battle-layout">
        
        <!-- Left Column: Player A -->
        <div class="side-column player-a" id="card-a">
            <div class="poke-info-top">
                <div class="poke-meta-row">
                    <span class="poke-name" id="poke-a-name">-</span>
                    <span class="poke-level" id="poke-a-level">Lv.50</span>
                </div>
                <div class="type-container" id="poke-a-types">
                    <!-- Badges injected dynamically -->
                </div>
                <div class="hp-bar-bg">
                    <div class="hp-bar-val" id="poke-a-hp-fill"></div>
                </div>
                <div class="hp-text" id="poke-a-hp-text">-/-</div>
            </div>
            <div class="poke-display">
                <img id="poke-a-img" class="poke-image" src="" alt="pokemon A">
            </div>
        </div>

        <!-- Center Column: Slide / Standby -->
        <div class="center-column">
            <!-- Slide frame -->
            <div class="slide-container" id="slide-container" style="display: none;">
                <iframe id="slide-iframe" src="" frameborder="0" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
                
                <!-- Score Display Overlay (active only when target is Other / spectator only score) -->
                <div class="score-overlay hidden" id="grader-only-score-box">
                    <div class="score-lbl">現在の採点結果</div>
                    <div class="score-val" id="grader-score-display">0 点</div>
                </div>
            </div>

            <!-- Standby message (when no slide is active) -->
            <div class="standby-container" id="standby-view">
                <div class="standby-title">PK_OGIRI</div>
                <div class="standby-desc" id="standby-status-desc">現在、行われているバトルはありません。</div>
            </div>
        </div>

        <!-- Right Column: Player B -->
        <div class="side-column player-b" id="card-b">
            <div class="poke-info-top">
                <div class="poke-meta-row">
                    <span class="poke-name" id="poke-b-name">-</span>
                    <span class="poke-level" id="poke-b-level">Lv.50</span>
                </div>
                <div class="type-container" id="poke-b-types">
                    <!-- Badges injected dynamically -->
                </div>
                <div class="hp-bar-bg">
                    <div class="hp-bar-val" id="poke-b-hp-fill"></div>
                </div>
                <div class="hp-text" id="poke-b-hp-text">-/-</div>
            </div>
            <div class="poke-display">
                <img id="poke-b-img" class="poke-image" src="" alt="pokemon B">
            </div>
        </div>

    </div>

    <!-- Bottom Column: Battle Log Message Box -->
    <div class="bottom-log-container">
        <div class="log-header">
            <span>💬 BATTLE LOG</span>
        </div>
        <div class="battle-log" id="battle-log">
            <!-- Logs will append here -->
        </div>
    </div>

    <script>
        // Mapping of pokemon types to class names
        const TYPE_MAP = {
            "ノーマル": "type-normal", "ほのお": "type-fire", "みず": "type-water",
            "くさ": "type-grass", "でんき": "type-electric", "こおり": "type-ice",
            "かくとう": "type-fighting", "どく": "type-poison", "じめん": "type-ground",
            "ひこう": "type-flying", "エスパー": "type-psychic", "むし": "type-bug",
            "いわ": "type-rock", "ゴースト": "type-ghost", "ドラゴン": "type-dragon",
            "はがね": "type-steel", "フェアリー": "type-fairy", "あく": "type-dark"
        };

        // Static Pokedex ID dictionary for the 72 custom Pokemons
        const POKE_ID_MAP = {
            "アーケオス": 567, "アーマーガア": 823, "アシレーヌ": 730, "アマルルガ": 699,
            "イオルブ": 826, "イワパレス": 558, "ウォッシュロトム": 479, "ウルガモス": 637,
            "エルレイド": 475, "エンニュート": 758, "エンペルト": 395, "オーロンゲ": 861,
            "オニシズクモ": 752, "オンバーン": 715, "ガオガエン": 727, "カバルドン": 450,
            "カビゴン": 143, "キノガッサ": 286, "ギャラドス": 130, "キラフロル": 970,
            "クレベース": 713, "ゲンガー": 94, "ケンタロス": 128, "コノヨザル": 979,
            "サーナイト": 282, "サーフゴー": 1000, "サザンドラ": 635, "シャワーズ": 134,
            "シュバルゴ": 589, "ズルズキン": 560, "ゾロアーク": 571, "デスカーン": 563,
            "デンリュウ": 181, "ドオー": 980, "トゲキッス": 468, "ドダイトス": 389,
            "ドドゲザン": 983, "ドラパルト": 887, "ドリュウズ": 530, "ニンフィア": 700,
            "ヌメルゴン": 706, "ネンドール": 344, "ノクタス": 332, "バイバニラ": 584,
            "ハガネール": 208, "バクーダ": 323, "バシャーモ": 257, "ハッサム": 212,
            "ハラバリー": 939, "バンギラス": 248, "ヒートロトム": 479, "ブリジュラス": 1018,
            "ブリムオン": 858, "ベトベトン": 89, "ボーマンダ": 373, "ボスゴドラ": 306,
            "ポリゴンZ": 137, "マタドガス": 110, "マタドガス（ガラル）": 110, "マンムー": 473,
            "ミカルゲ": 442, "ムクホーク": 398, "メタグロス": 376, "ヤドラン": 80,
            "ユレイドル": 346, "ヨノワール": 477, "ラプラス": 131, "ラフレシア": 45,
            "ランクルス": 579, "リザードン": 6, "ルカリオ": 448, "レントラー": 405
        };

        function getPokedexId(name) {
            if (!name) return 1;
            let clean = name.split('(')[0].split('（')[0].trim();
            if (clean.includes('マタドガス')) return 110;
            return POKE_ID_MAP[clean] || POKE_ID_MAP[name] || 1;
        }

        function getPokemonImageUrl(name) {
            const id = getPokedexId(name);
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
        }

        function renderTypes(type1, type2) {
            let html = '';
            if (type1 && type1 !== '-') {
                const cls = TYPE_MAP[type1] || 'type-normal';
                html += `<span class="type-badge ${cls}">${type1}</span>`;
            }
            if (type2 && type2 !== '-') {
                const cls = TYPE_MAP[type2] || 'type-normal';
                html += `<span class="type-badge ${cls}">${type2}</span>`;
            }
            return html || '<span class="type-badge type-normal">???</span>';
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/battle/viewer/status');
                const data = await res.json();
                
                if (data.success) {
                    // 1. Update slide
                    const slideContainer = document.getElementById('slide-container');
                    const standbyView = document.getElementById('standby-view');
                    const slideIframe = document.getElementById('slide-iframe');
                    
                    if (data.slide_url) {
                        let embedUrl = data.slide_url;
                        
                        // Extract URL from raw iframe tag if pasted
                        if (embedUrl.trim().startsWith('<iframe')) {
                            const srcMatch = embedUrl.match(/src=["']([^"']+)["']/i);
                            if (srcMatch) {
                                embedUrl = srcMatch[1];
                            }
                        }

                        if (embedUrl.includes('docs.google.com/presentation')) {
                            const match = embedUrl.match(/\/presentation\/d\/([a-zA-Z0-9-_]+)/);
                            if (match) {
                                embedUrl = `https://docs.google.com/presentation/d/${match[1]}/embed`;
                            }
                        }
                        
                        if (slideIframe.src !== embedUrl) {
                            slideIframe.src = embedUrl;
                        }
                        
                        slideContainer.style.display = 'block';
                        standbyView.style.display = 'none';
                        slideContainer.className = 'slide-container active-slide';
                    } else {
                        slideContainer.style.display = 'none';
                        standbyView.style.display = 'flex';
                        slideIframe.src = '';
                        slideContainer.className = 'slide-container';
                    }

                    // Update standby text based on battle status
                    const standbyDesc = document.getElementById('standby-status-desc');
                    if (data.active) {
                        standbyDesc.textContent = "お題スライドの表示をお待ちください。";
                        
                        // Show side columns
                        document.getElementById('card-a').classList.remove('hidden');
                        document.getElementById('card-b').classList.remove('hidden');
                        
                        // Populate Player A details
                        const pokeA = data.a_pokemon[data.a_active_idx];
                        if (pokeA) {
                            document.getElementById('poke-a-name').textContent = pokeA.name;
                            document.getElementById('poke-a-level').textContent = `Lv.${pokeA.level || 50}`;
                            
                            const hpFillA = pokeA.max_hp > 0 ? (pokeA.hp / pokeA.max_hp) * 100 : 0;
                            const hpBarA = document.getElementById('poke-a-hp-fill');
                            hpBarA.style.width = `${hpFillA}%`;
                            
                            // Dynamically color HP bar
                            if (hpFillA <= 20) {
                                hpBarA.style.backgroundColor = '#ef4444'; // Red
                            } else if (hpFillA <= 50) {
                                hpBarA.style.backgroundColor = '#f59e0b'; // Orange
                            } else {
                                hpBarA.style.backgroundColor = '#10b981'; // Green
                            }
                            
                            document.getElementById('poke-a-hp-text').textContent = `${pokeA.hp}/${pokeA.max_hp}`;
                            document.getElementById('poke-a-types').innerHTML = renderTypes(pokeA.type1, pokeA.type2);
                            
                            // Set Pokemon Image
                            const imgA = document.getElementById('poke-a-img');
                            const targetUrlA = getPokemonImageUrl(pokeA.name);
                            if (imgA.src !== targetUrlA) {
                                imgA.src = targetUrlA;
                            }
                        }

                        // Populate Player B details
                        const pokeB = data.b_pokemon[data.b_active_idx];
                        if (pokeB) {
                            document.getElementById('poke-b-name').textContent = pokeB.name;
                            document.getElementById('poke-b-level').textContent = `Lv.${pokeB.level || 50}`;
                            
                            const hpFillB = pokeB.max_hp > 0 ? (pokeB.hp / pokeB.max_hp) * 100 : 0;
                            const hpBarB = document.getElementById('poke-b-hp-fill');
                            hpBarB.style.width = `${hpFillB}%`;
                            
                            // Dynamically color HP bar
                            if (hpFillB <= 20) {
                                hpBarB.style.backgroundColor = '#ef4444';
                            } else if (hpFillB <= 50) {
                                hpBarB.style.backgroundColor = '#f59e0b';
                            } else {
                                hpBarB.style.backgroundColor = '#10b981';
                            }
                            
                            document.getElementById('poke-b-hp-text').textContent = `${pokeB.hp}/${pokeB.max_hp}`;
                            document.getElementById('poke-b-types').innerHTML = renderTypes(pokeB.type1, pokeB.type2);

                            // Set Pokemon Image
                            const imgB = document.getElementById('poke-b-img');
                            const targetUrlB = getPokemonImageUrl(pokeB.name);
                            if (imgB.src !== targetUrlB) {
                                imgB.src = targetUrlB;
                            }
                        }

                        // Highlight active targeted image
                        const isTargetA = data.target_player === 'A';
                        const isTargetB = data.target_player === 'B';
                        
                        document.getElementById('card-a').className = 'side-column player-a' + (isTargetA ? ' active-target' : '');
                        document.getElementById('card-b').className = 'side-column player-b' + (isTargetB ? ' active-target' : '');

                        // Handle Grader Only / Spectator Score display
                        const scoreBox = document.getElementById('grader-only-score-box');
                        if (!isTargetA && !isTargetB && data.last_confirmed_score !== null) {
                            scoreBox.classList.remove('hidden');
                            document.getElementById('grader-score-display').textContent = `${data.last_confirmed_score} 点`;
                        } else {
                            scoreBox.classList.add('hidden');
                        }
                    } else {
                        standbyDesc.textContent = "現在、行われているバトルはありません。";
                        
                        // Hide side columns when no active battle
                        document.getElementById('card-a').classList.add('hidden');
                        document.getElementById('card-b').classList.add('hidden');
                        document.getElementById('grader-only-score-box').classList.add('hidden');
                    }

                    // 4. Update Logs
                    const logBox = document.getElementById('battle-log');
                    logBox.innerHTML = '';
                    (data.messages || []).forEach(msg => {
                        const div = document.createElement('div');
                        div.textContent = msg;
                        logBox.appendChild(div);
                    });
                    logBox.scrollTop = logBox.scrollHeight;
                }
            } catch (err) {
                console.error("Error updating battle status:", err);
            }
        }

        setInterval(updateStatus, 1500);
        updateStatus();
    </script>
</body>
</html>
